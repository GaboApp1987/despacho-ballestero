name: despacho_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.4
  # Exportación
  pdf: ^3.10.8
  printing: ^5.11.1
  excel: ^4.0.3
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  # Compartir
  share_plus: ^10.1.0
  url_launcher: ^6.3.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

# Ícono de la app (Android y Windows) -- se regenera con
# `dart run flutter_launcher_icons` cada vez que cambie
# assets/branding/icon_source.png (el wordmark "equilibra" sobre fondo
# oscuro, mismo trazo que el logo animado del login).
flutter_launcher_icons:
  android: true
  windows:
    generate: true
    image_path: "assets/branding/icon_source.png"
    icon_size: 256
  image_path: "assets/branding/icon_source.png"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/arial.ttf
    - assets/fonts/arialbd.ttf
